<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tablero de Producción - Planeación</title>
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <span class="navbar-brand mb-0 h1">Sistema de Tornos - Tablero ACP & Ventas</span>
    </div>
</nav>

<div class="container">
    <!-- Tarjetas de KPIs y Gráfica -->
    <div class="row mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-3 h-100">
                <div class="card-body">
                    <h5 class="card-title">Total de Órdenes</h5>
                    <h1 class="display-4" th:text="${totalOrdenes}">0</h1>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-danger mb-3 h-100">
                <div class="card-body">
                    <h5 class="card-title">Órdenes Críticas / Atrasadas</h5>
                    <h1 class="display-4" th:text="${ordenesCriticas}">0</h1>
                </div>
            </div>
        </div>
        <div class="col-md-4 d-flex justify-content-center align-items-center bg-white rounded shadow-sm">
            <!-- Contenedor para la Gráfica -->
            <canvas id="graficaPrioridades" style="max-height: 150px;"></canvas>
        </div>
    </div>

    <!-- Tabla de Órdenes -->
    <div class="card shadow-sm">
        <div class="card-header bg-white">
            <h5 class="mb-0">Seguimiento de Órdenes Activas</h5>
        </div>
        <div class="card-body">
            <table class="table table-hover table-bordered align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Orden de Venta</th>
                        <th>Cliente</th>
                        <th>Fecha Prometida</th>
                        <th>Prioridad Sistema</th>
                        <th>Prioridad Ventas</th>
                        <th>Estado</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="orden : ${ordenes}">
                        <td class="fw-bold" th:text="${orden.idOrden}">OV-000</td>
                        <td th:text="${orden.cliente.nombre}">Cliente</td>
                        <td th:text="${orden.fechaEntregaPrometida}">2026-01-01</td>

                        <!-- Etiqueta de Prioridad del Sistema -->
                        <td>
                            <span class="badge"
                                  th:classappend="${orden.prioridadSistema <= 1 ? 'bg-danger' : (orden.prioridadSistema == 2 ? 'bg-warning text-dark' : 'bg-success')}"
                                  th:text="'Nivel ' + ${orden.prioridadSistema}">
                            </span>
                        </td>

                        <!-- Etiqueta de Prioridad de Ventas (Sobrescritura) -->
                        <!-- Columna Interactiva para Prioridad de Ventas -->
                        <td>
                            <div class="input-group input-group-sm" style="max-width: 150px;">
                                <select class="form-select" th:id="'select-prioridad-' + ${orden.idOrden}">
                                    <option value="" th:selected="${orden.prioridadVentas == null}">Automático</option>
                                    <option value="1" th:selected="${orden.prioridadVentas == 1}">1 - Crítica</option>
                                    <option value="2" th:selected="${orden.prioridadVentas == 2}">2 - Alta</option>
                                    <option value="3" th:selected="${orden.prioridadVentas == 3}">3 - Normal</option>
                                </select>
                                <button class="btn btn-outline-primary"
                                        th:data-id="${orden.idOrden}"
                                        onclick="actualizarPrioridad(this.getAttribute('data-id'))">
                                    Guardar
                                </button>
                            </div>
                        </td>
                        <td>
                            <span class="badge bg-secondary" th:text="${orden.estado}">ESTADO</span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Script para renderizar la gráfica leyendo los datos de Thymeleaf -->
<script th:inline="javascript">
    /*<![CDATA[*/
    const criticas = /*[[${ordenesCriticas}]]*/ 0;
    const pendientes = /*[[${ordenesPendientes}]]*/ 0;

    const ctx = document.getElementById('graficaPrioridades').getContext('2d');
    new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: ['Críticas (Urgentes)', 'Operación Normal'],
            datasets: [{
                data: [criticas, pendientes],
                backgroundColor: ['#dc3545', '#198754'],
                hoverOffset: 4
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'right',
                }
            }
        }
    });
    /*]]>*/
</script>
<script>
    function actualizarPrioridad(idOrden) {
        const selectElement = document.getElementById('select-prioridad-' + idOrden);
        const nuevaPrioridad = selectElement.value;

        // Construimos la URL dinámicamente
        // Si nuevaPrioridad tiene valor (1, 2 o 3), lo agregamos.
        // Si está vacío (Automático), mandamos la petición sin parámetro para que llegue nulo al servidor.
        const url = nuevaPrioridad ?
            `/api/ordenes/${idOrden}/prioridad?nivel=${nuevaPrioridad}` :
            `/api/ordenes/${idOrden}/prioridad`;

        fetch(url, {
            method: 'PUT'
        })
            .then(response => {
                if (response.ok) {
                    window.location.reload();
                } else {
                    alert("Hubo un error al intentar actualizar la prioridad en el servidor.");
                }
            })
            .catch(error => {
                console.error("Error de red:", error);
                alert("No se pudo conectar con el servidor.");
            });
    }
</script>
</body>
</html>
